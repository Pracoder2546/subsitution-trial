<!DOCTYPE html>
<html>
<head>
  <title>School Substitution</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📚 Substitution Generator</h1>

<div class="controls">

  <h3>👨‍🏫 Teacher Attendance</h3>

  <div class="manage">
    <input id="newTeacher" placeholder="Teacher name">
    <button onclick="addTeacher()">➕ Add</button>
  </div>

  <div id="attendance"></div>

  <label>📅 Day</label>
  <select id="day">
    <option value="0">Monday</option>
    <option value="1">Tuesday</option>
    <option value="2">Wednesday</option>
    <option value="3">Thursday</option>
    <option value="4">Friday</option>
  </select>

  <br><br>
  <button onclick="generate()">Generate Table</button>

</div>

<div id="output"></div>

<script src="script.js"></script>
</body>
</html>
